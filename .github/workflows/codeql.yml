# SPDX-License-Identifier: GPL-3.0-or-later
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: analyze-c-cpp
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub-hosted runner contract
        shell: bash
        run: |
          if [ "${{ runner.environment }}" != 'github-hosted' ]; then
            echo '::error::this job requires a GitHub-hosted runner'
            exit 1
          fi

      - name: Check out source
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev libsoup-3.0-dev libsodium-dev \
            libtss2-dev

      - name: Initialize CodeQL
        # github/codeql-action v4
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: c-cpp
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      - name: Configure
        run: |
          meson setup builddir \
            -Denable_tpm=enabled \
            -Denable_audit=enabled \
            -Dduckdb_source=prebuilt

      - name: Build
        run: meson compile -C builddir

      - name: Perform CodeQL analysis
        # github/codeql-action v4
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          output: sarif-results
          upload: failure-only

      - name: Upload CodeQL SARIF
        # github/codeql-action v4
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          sarif_file: sarif-results/cpp.sarif
