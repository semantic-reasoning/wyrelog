# SPDX-License-Identifier: GPL-3.0-or-later
name: CI PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify GitHub-hosted runner contract
        shell: bash
        run: |
          if [ "${{ runner.environment }}" != 'github-hosted' ]; then
            echo '::error::this job requires a GitHub-hosted runner'
            exit 1
          fi

      - name: Check out source
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # check-format.sh --changed diffs against the pull request base, so
          # the base commit has to be present rather than a depth-1 tip.
          fetch-depth: 0

      - name: Install pinned Uncrustify
        run: |
          format_prefix="$RUNNER_TEMP/uncrustify"
          ./tools/install-uncrustify.sh "$format_prefix"
          echo "$format_prefix/bin" >> "$GITHUB_PATH"

      # --changed re-verifies every migrated file in tools/formatted-files.txt
      # and additionally requires each C file this pull request touches to be
      # migrated, so the ledger only ever grows.
      - name: Check C formatting
        run: |
          ./tools/check-format.sh --changed "origin/${{ github.base_ref }}"
          ./tools/test-format-tooling.sh

  build-posix:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      # Relativise absolute paths baked into debug info so cache entries stay
      # valid across runs even though the workspace path is fixed on hosted
      # runners; matches the Windows job.
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tpm: enabled
          - os: macos-latest
            tpm: disabled
    steps:
      - name: Verify GitHub-hosted runner contract
        shell: bash
        run: |
          if [ "${{ runner.environment }}" != 'github-hosted' ]; then
            echo '::error::this job requires a GitHub-hosted runner'
            exit 1
          fi

      - name: Check out source
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config patch time \
            libglib2.0-dev libsqlite3-dev libsoup-3.0-dev libsodium-dev \
            libtss2-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew update
          brew install meson ninja pkg-config glib sqlite libsoup libsodium gpatch

      - name: Restore meson packagecache
        # actions/cache v5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: subprojects/packagecache
          key: ${{ runner.os }}-packagecache-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: |
            ${{ runner.os }}-packagecache-

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        # mozilla-actions/sccache-action v0.0.10
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696

      - name: Select compiler cache
        shell: bash
        run: |
          if [ "${{ steps.sccache.outcome }}" = success ] \
            && command -v sccache >/dev/null 2>&1 \
            && sccache --version >/dev/null 2>&1; then
            echo 'CC=sccache cc' >> "$GITHUB_ENV"
            echo 'CXX=sccache c++' >> "$GITHUB_ENV"
          else
            echo 'CC=cc' >> "$GITHUB_ENV"
            echo 'CXX=c++' >> "$GITHUB_ENV"
            echo 'sccache unavailable; using native compiler'
          fi

      - name: Configure
        run: |
          meson setup builddir \
            -Denable_tpm=${{ matrix.tpm }} \
            -Denable_audit=enabled \
            -Dduckdb_source=prebuilt

      - name: Build and test
        run: meson test -C builddir --print-errorlogs --suite wyrelog

      - name: Verify artifact inventory consumer contract
        run: |
          meson test -C builddir --no-rebuild \
            fact-artifact-inventory-contract \
            fact-artifact-inventory-consumer-contract \
            fact-artifact-namespace-inventory \
            fact-artifact-inventory-consumer-wiring \
            fact-artifact-inventory-consumer-wiring-self \
            fact-artifact-transition-driver \
            fact-artifact-transition-driver-wiring \
            fact-artifact-transition-driver-wiring-self \
            fact-artifact-transition-posix \
            --print-errorlogs

      - name: Build fact-store production daemon
        if: runner.os == 'Linux'
        run: |
          meson setup build-fact -Denable_fact_store=enabled \
            -Denable_audit=enabled -Dduckdb_source=prebuilt
          meson compile -C build-fact wyrelogd

      - name: Provision secure DuckDB compile swap
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/duckdb-compile-swap.sh provision secure

      - name: Build secure DuckDB backend from pinned source
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            patch --version
          else
            gpatch --version
          fi | grep -F 'GNU patch'
          if [ "$RUNNER_OS" = Linux ]; then
            CC=cc CXX=c++ meson setup build-secure-duckdb \
              -Denable_fact_store=enabled \
              -Dduckdb_source=subproject \
              -Denable_secure_duckdb_bridge=enabled
          else
            meson setup build-secure-duckdb \
              -Denable_fact_store=enabled \
              -Dduckdb_source=subproject \
              -Denable_secure_duckdb_bridge=enabled
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            time_args=(-v)
          else
            time_args=(-l)
          fi
          /usr/bin/time "${time_args[@]}" \
            meson compile -C build-secure-duckdb -j 1 \
            test-fact-artifact-inventory \
            test-fact-artifact-inventory-consumers \
            test-fact-artifact-namespace \
            test-fact-artifact-transition-driver \
            test-fact-artifact-transition-posix \
            test-secure-duckdb-bridge \
            test-secure-duckdb-filesystem \
            test-secure-duckdb-recording-filesystem
          meson test -C build-secure-duckdb --no-rebuild \
            fact-artifact-inventory-contract \
            fact-artifact-inventory-consumer-contract \
            fact-artifact-namespace-inventory \
            fact-artifact-inventory-consumer-wiring \
            fact-artifact-inventory-consumer-wiring-self \
            fact-artifact-transition-driver \
            fact-artifact-transition-driver-wiring \
            fact-artifact-transition-driver-wiring-self \
            fact-artifact-transition-posix \
            secure-duckdb-bridge \
            secure-duckdb-filesystem secure-duckdb-recording-filesystem \
            --print-errorlogs
          if meson setup build-secure-duckdb-prebuilt \
              -Denable_fact_store=enabled \
              -Dduckdb_source=prebuilt \
              -Denable_secure_duckdb_bridge=enabled; then
            echo 'secure DuckDB bridge unexpectedly accepted prebuilt DuckDB'
            exit 1
          fi

      - name: Test fact forget transaction cleanup with secure DuckDB
        run: |
          meson compile -C build-secure-duckdb -j 1 \
            test-fact-store-forget-transaction \
            test-fact-store-forget-transaction-provision-helper \
            test-fact-store-forget-transaction-provisioned
          meson test -C build-secure-duckdb --no-rebuild \
            fact-store-forget-transaction \
            fact-store-forget-transaction-provisioned \
            --print-errorlogs

      - name: Remove secure DuckDB compile swap
        if: ${{ runner.environment == 'github-hosted' && (always() && runner.os == 'Linux') }}
        run: |
          bash .github/scripts/duckdb-compile-swap.sh cleanup secure

      - name: Show sccache statistics
        if: ${{ runner.environment == 'github-hosted' && (always()) }}
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || echo 'sccache statistics unavailable'
          else
            echo 'sccache unavailable; no statistics to show'
          fi

      - name: Upload meson logs on failure
        if: ${{ runner.environment == 'github-hosted' && (failure()) }}
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: meson-logs-${{ matrix.os }}
          path: |
            builddir/meson-logs/
            build-secure-duckdb/meson-logs/
          if-no-files-found: ignore

  service-credential-e2e:
    name: service-credential-e2e
    # Linux runtime enforcement of the packaged service-credential acceptance
    # suite (#382 / #766). The SC e2e drivers are gated in tests/meson.build on
    # host == linux AND build_client AND enable_fact_store AND enable_audit
    # (and enable_fault_injection for the publication-fault proof), so a build
    # that omits those options never registers them. This dedicated job builds
    # with exactly those options and runs the packaged suite (NOT the whole
    # --suite wyrelog, to keep it independent of unrelated pre-existing
    # fact-store-config failures) so the platform matrix's Linux runtime claim
    # is actually exercised on a runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify GitHub-hosted runner contract
        shell: bash
        run: |
          if [ "${{ runner.environment }}" != 'github-hosted' ]; then
            echo '::error::this job requires a GitHub-hosted runner'
            exit 1
          fi

      - name: Check out source
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config time python3 \
            libglib2.0-dev libsqlite3-dev libsoup-3.0-dev libsodium-dev \
            libtss2-dev

      - name: Cache meson packagecache
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: subprojects/packagecache
          key: ${{ runner.os }}-packagecache-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: |
            ${{ runner.os }}-packagecache-

      - name: Configure packaged service-credential runtime
        run: |
          meson setup builddir \
            -Denable_client=enabled \
            -Denable_fact_store=enabled \
            -Denable_audit=enabled \
            -Denable_fault_injection=enabled \
            -Dduckdb_source=prebuilt

      - name: Run the packaged service-credential e2e suite
        run: |
          meson test -C builddir --print-errorlogs \
            service-credential-lifecycle-e2e \
            service-credential-zero-survivor-e2e \
            service-credential-rotation-e2e \
            service-credential-leak-scan-e2e \
            service-credential-publication-fault-e2e \
            service-credential-platform-matrix

      - name: Upload meson logs on failure
        if: ${{ runner.environment == 'github-hosted' && (failure()) }}
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: meson-logs-service-credential-e2e
          path: builddir/meson-logs/
          if-no-files-found: ignore

  duckdb-checkpoint-seam:
    name: duckdb-checkpoint-seam-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Verify GitHub-hosted runner contract
        shell: bash
        run: |
          if [ "${{ runner.environment }}" != 'github-hosted' ]; then
            echo '::error::this job requires a GitHub-hosted runner'
            exit 1
          fi

      - name: Check out source
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config patch \
            libglib2.0-dev libsqlite3-dev libsoup-3.0-dev libsodium-dev
          sudo apt-get install -y --no-install-recommends time
          sudo apt-get clean

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew update
          brew install meson ninja pkg-config glib sqlite libsoup libsodium gpatch

      - name: Restore meson packagecache
        # actions/cache v5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: subprojects/packagecache
          key: ${{ runner.os }}-packagecache-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: |
            ${{ runner.os }}-packagecache-

      - name: Provision bounded Linux compile swap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash .github/scripts/duckdb-compile-swap.sh provision seam

      - name: Configure focused checkpoint seam
        run: |
          CC=cc CXX=c++ meson setup build-duckdb-seam \
            -Denable_tpm=disabled \
            -Denable_fact_store=enabled \
            -Dduckdb_source=subproject \
            -Denable_secure_duckdb_bridge=enabled

      - name: Build focused checkpoint seam
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find build-duckdb-seam -name libduckdb.a \
            -print -quit)"
          if [ "$RUNNER_OS" = Linux ]; then
            for target in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
              available="$(df -B1 --output=avail "$target" | tail -1)"
              test "$available" -ge 4000000000
            done
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            /usr/bin/time -v meson compile -C build-duckdb-seam \
              -j 1 test-duckdb-after-walstart
          else
            /usr/bin/time -l meson compile -C build-duckdb-seam \
              -j 1 test-duckdb-after-walstart
          fi
          test -z "$(find build-duckdb-seam -name libduckdb.a \
            -print -quit)"

      - name: Test focused checkpoint seam
        run: |
          meson test -C build-duckdb-seam --no-rebuild \
            duckdb-after-walstart-no-wal \
            duckdb-after-walstart-rendezvous \
            duckdb-valid-commit-failure \
            duckdb-valid-rollback-failure \
            duckdb-patch-stack-determinism \
            duckdb-patch-stack-determinism-self-test \
            duckdb-patch-stack-determinism-strict \
            duckdb-fixed-wal-successful-checkpoint \
            duckdb-fixed-wal-pre-move-abort-reopen \
            duckdb-fixed-wal-interrupted-recovery \
            duckdb-after-walstart-boundary \
            duckdb-transaction-control-boundary \
            duckdb-test-seam-wiring \
            duckdb-fixed-wal-lifecycle-boundary \
            --print-errorlogs

      - name: Repeat fixed WAL lifecycle evidence
        run: |
          set -euo pipefail
          for iteration in 1 2 3 4 5; do
            echo "fixed WAL lifecycle iteration ${iteration}/5"
            meson test -C build-duckdb-seam --no-rebuild \
              duckdb-fixed-wal-successful-checkpoint \
              duckdb-fixed-wal-pre-move-abort-reopen \
              duckdb-fixed-wal-interrupted-recovery \
              --print-errorlogs
          done

      - name: Remove bounded Linux compile swap
        if: ${{ runner.environment == 'github-hosted' && (always() && runner.os == 'Linux') }}
        shell: bash
        run: |
          bash .github/scripts/duckdb-compile-swap.sh cleanup seam

      - name: Upload seam meson logs on failure
        if: ${{ runner.environment == 'github-hosted' && (failure()) }}
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: duckdb-checkpoint-seam-logs-${{ matrix.os }}
          path: build-duckdb-seam/meson-logs/
          if-no-files-found: ignore

  daemon-http-shared-fact:
    name: daemon-http-shared-fact-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Verify GitHub-hosted runner contract
        shell: bash
        run: |
          if [ "${{ runner.environment }}" != 'github-hosted' ]; then
            echo '::error::this job requires a GitHub-hosted runner'
            exit 1
          fi

      - name: Check out source
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev libsoup-3.0-dev libsodium-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew update
          brew install meson ninja pkg-config glib sqlite libsoup libsodium

      - name: Restore meson packagecache
        # actions/cache v5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: subprojects/packagecache
          key: ${{ runner.os }}-packagecache-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: |
            ${{ runner.os }}-packagecache-

      - name: Configure shared fact-store daemon HTTP tests
        run: |
          meson setup build-daemon-http-shared \
            -Ddefault_library=shared \
            -Denable_tpm=disabled \
            -Denable_client=enabled \
            -Denable_fact_store=enabled \
            -Denable_audit=enabled \
            -Dduckdb_source=prebuilt

      - name: Compile daemon HTTP variants
        id: compile_daemon_http
        run: |
          meson compile -C build-daemon-http-shared \
            test-daemon-http-decide \
            test-daemon-http-decide-refresh \
            test-daemon-http-decide-service \
            test-daemon-http-decide-audit

      - name: Test daemon HTTP variants
        run: |
          meson test -C build-daemon-http-shared --no-rebuild \
            daemon-http-decide \
            daemon-http-decide-refresh \
            daemon-http-decide-service \
            daemon-http-decide-audit \
            daemon-http-decide-private-symbols \
            --print-errorlogs

      - name: Capture daemon HTTP audit provenance
        if: ${{ runner.environment == 'github-hosted' && (always() && steps.compile_daemon_http.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          meson test -C build-daemon-http-shared --no-rebuild \
            daemon-http-decide-audit --verbose --print-errorlogs

      - name: Upload daemon HTTP meson logs on failure
        if: ${{ runner.environment == 'github-hosted' && (failure()) }}
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: daemon-http-shared-fact-logs-${{ matrix.os }}
          path: build-daemon-http-shared/meson-logs/
          if-no-files-found: ignore

  policy-write-focused-sanitizer:
    name: policy-write-focused-sanitizer-ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_summary=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_summary=1:print_stacktrace=1
    steps:
      - name: Verify GitHub-hosted runner contract
        shell: bash
        run: |
          if [ "${{ runner.environment }}" != 'github-hosted' ]; then
            echo '::error::this job requires a GitHub-hosted runner'
            exit 1
          fi

      - name: Check out source
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev libsoup-3.0-dev libsodium-dev

      - name: Restore meson packagecache
        # actions/cache v5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: subprojects/packagecache
          key: Linux-packagecache-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: |
            Linux-packagecache-

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        # mozilla-actions/sccache-action v0.0.10
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696

      - name: Select compiler cache
        shell: bash
        run: |
          if [ "${{ steps.sccache.outcome }}" = success ] \
            && command -v sccache >/dev/null 2>&1 \
            && sccache --version >/dev/null 2>&1; then
            echo 'CC=sccache cc' >> "$GITHUB_ENV"
            echo 'CXX=sccache c++' >> "$GITHUB_ENV"
          else
            echo 'CC=cc' >> "$GITHUB_ENV"
            echo 'CXX=c++' >> "$GITHUB_ENV"
            echo 'sccache unavailable; using native compiler'
          fi

      - name: Configure policy WRITE sanitizer tests
        run: |
          meson setup build-policy-write-sanitizer \
            -Ddefault_library=shared \
            -Denable_tpm=disabled \
            -Denable_client=enabled \
            -Denable_fact_store=enabled \
            -Denable_audit=enabled \
            -Dduckdb_source=prebuilt \
            -Db_sanitize=address,undefined

      - name: Compile focused policy WRITE tests
        run: |
          meson compile -C build-policy-write-sanitizer \
            test-fact-artifact-inventory \
            test-fact-artifact-inventory-consumers \
            test-fact-artifact-namespace \
            test-fact-artifact-transition-driver \
            test-fact-artifact-transition-posix \
            test-service-auth-coordination \
            test-daemon-http-decide \
            test-daemon-http-decide-audit \
            test-daemon-http-decide-service

      - name: Test focused policy WRITE paths
        run: |
          meson test -C build-policy-write-sanitizer --no-rebuild \
            fact-artifact-inventory-contract \
            fact-artifact-inventory-consumer-contract \
            fact-artifact-namespace-inventory \
            fact-artifact-inventory-consumer-wiring \
            fact-artifact-inventory-consumer-wiring-self \
            fact-artifact-transition-driver \
            fact-artifact-transition-driver-wiring \
            fact-artifact-transition-driver-wiring-self \
            fact-artifact-transition-posix \
            service-auth-coordination \
            daemon-http-decide \
            daemon-http-decide-audit \
            daemon-http-decide-service \
            --print-errorlogs

      - name: Repeat policy WRITE coordination paths
        run: |
          meson test -C build-policy-write-sanitizer --no-rebuild \
            service-auth-coordination \
            daemon-http-decide \
            daemon-http-decide-audit \
            --repeat 5 \
            --print-errorlogs

      - name: Show sccache statistics
        if: ${{ runner.environment == 'github-hosted' && (always()) }}
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || echo 'sccache statistics unavailable'
          else
            echo 'sccache unavailable; no statistics to show'
          fi

      - name: Upload policy WRITE sanitizer logs on failure
        if: ${{ runner.environment == 'github-hosted' && (failure()) }}
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: policy-write-focused-sanitizer-logs-ubuntu
          path: build-policy-write-sanitizer/meson-logs/
          if-no-files-found: ignore

  daemon-http-shared-fact-audit-disabled:
    name: daemon-http-shared-fact-audit-disabled-ubuntu-fact-${{ matrix.fact_store }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fact_store: [enabled, disabled]
    steps:
      - name: Verify GitHub-hosted runner contract
        shell: bash
        run: |
          if [ "${{ runner.environment }}" != 'github-hosted' ]; then
            echo '::error::this job requires a GitHub-hosted runner'
            exit 1
          fi

      - name: Check out source
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libglib2.0-dev libsqlite3-dev libsoup-3.0-dev libsodium-dev

      - name: Restore meson packagecache
        # actions/cache v5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: subprojects/packagecache
          key: Linux-packagecache-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: |
            Linux-packagecache-

      - name: Configure shared fact-store daemon HTTP tests without audit
        run: |
          meson setup build-daemon-http-shared-audit-disabled \
            -Ddefault_library=shared \
            -Denable_tpm=disabled \
            -Denable_client=enabled \
            -Denable_fact_store=${{ matrix.fact_store }} \
            -Denable_audit=disabled \
            -Dduckdb_source=prebuilt

      - name: Compile audit-disabled daemon readiness targets
        run: |
          meson compile -C build-daemon-http-shared-audit-disabled \
            test-daemon-http-decide \
            test-daemon-http-decide-refresh \
            test-daemon-http-decide-service \
            test-daemon-checks-noaudit \
            wyrelogd-readiness-persistent-test \
            wyrelogd

      - name: Test daemon HTTP private symbols without audit
        if: matrix.fact_store == 'enabled'
        run: |
          meson test -C build-daemon-http-shared-audit-disabled --no-rebuild \
            daemon-http-decide-private-symbols \
            --print-errorlogs

      - name: Test audit-disabled daemon readiness
        run: |
          meson test -C build-daemon-http-shared-audit-disabled --no-rebuild \
            daemon-http-route-registrations \
            daemon-checks-noaudit \
            wyrelogd-check \
            wyrelogd-healthz \
            wyrelogd-readiness-persistent \
            --print-errorlogs

      - name: Upload audit-disabled daemon HTTP meson logs on failure
        if: ${{ runner.environment == 'github-hosted' && (failure()) }}
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: daemon-http-shared-fact-audit-disabled-logs-ubuntu-fact-${{ matrix.fact_store }}
          path: build-daemon-http-shared-audit-disabled/meson-logs/
          if-no-files-found: ignore

  build-windows:
    name: build-windows${{ matrix.job_suffix }}
    runs-on: ${{ matrix.runner }}
    # The pinned source build and focused secure-bridge tests are deliberately
    # retained in full, but a hung native child must not consume a runner
    # indefinitely (#846).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            fact_store: disabled
            secure_bridge: disabled
            duckdb_source: prebuilt
            job_suffix: ''
          - runner: windows-2025
            fact_store: enabled
            secure_bridge: disabled
            duckdb_source: prebuilt
            job_suffix: -fact
          # AppVerifier requires an elevated process. Keep the explicit hosted
          # image label on every row so a self-hosted runner carrying
          # windows-latest cannot claim the Windows matrix.
          - runner: windows-2025
            fact_store: enabled
            secure_bridge: enabled
            duckdb_source: subproject
            job_suffix: -secure-bridge
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      # Stays the checkout even though vcpkg no longer lives there: this only
      # relativises paths so hashes survive a moved tree, and both locations
      # are fixed on hosted runners, so the hit rate does not depend on it.
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - name: Verify hosted Windows runner contract
        shell: powershell
        run: |
          if ('${{ runner.environment }}' -ne 'github-hosted') {
            throw 'the Windows matrix requires a GitHub-hosted runner'
          }

      - name: Check out source
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # A dependency tree inside the checkout is indistinguishable from project
      # source to anything that walks the tree, which is how the POSIX runners
      # already see their system prefixes. The runner context is unavailable in
      # job-level env, so resolve the paths from RUNNER_TEMP here instead.
      - name: Point vcpkg outside the checkout
        shell: bash
        run: |
          vcpkg="${RUNNER_TEMP}\\vcpkg"
          binary_cache="${RUNNER_TEMP}\\vcpkg-binary-cache"
          {
            printf '%s\n' "VCPKG_ROOT=${vcpkg}"
            printf '%s\n' "VCPKG_INSTALLED_DIR=${vcpkg}\\installed\\x64-windows"
            printf '%s\n' "VCPKG_DEFAULT_BINARY_CACHE=${binary_cache}"
            printf '%s\n' "VCPKG_BINARY_SOURCES=clear;files,${binary_cache},readwrite"
          } >> "$GITHUB_ENV"

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        # mozilla-actions/sccache-action v0.0.10
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696

      - name: Select Windows compiler cache
        shell: bash
        run: |
          sccache_path="${SCCACHE_PATH:-$(command -v sccache || true)}"
          sccache_exe="$(cygpath -w "$sccache_path" 2>/dev/null || true)"
          case "$sccache_exe" in *.exe|*.EXE) ;; *) sccache_exe="" ;; esac
          if [ "${{ steps.sccache.outcome }}" = success \
            ] && [ -n "$sccache_exe" ] \
            && [ -x "$sccache_path" ] \
            && "$sccache_path" --version >/dev/null 2>&1; then
            echo 'WYRELOG_USE_SCCACHE=1' >> "$GITHUB_ENV"
            echo "SCCACHE_EXE=$sccache_exe" >> "$GITHUB_ENV"
            dirname "$sccache_path" >> "$GITHUB_PATH"
          else
            echo 'WYRELOG_USE_SCCACHE=0' >> "$GITHUB_ENV"
            echo 'sccache unavailable; using native clang-cl'
          fi

      - name: Remove system vcpkg
        shell: bash
        run: rm -rf "$VCPKG_INSTALLATION_ROOT"

      - name: Bootstrap vendored vcpkg
        shell: cmd
        run: |
          @echo off
          git clone --depth 1 --branch 2026.04.27 https://github.com/microsoft/vcpkg.git "%VCPKG_ROOT%"
          call "%VCPKG_ROOT%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        # actions/cache v5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # v5, with no fallbacks: actions/cache stores archive members
          # relative to GITHUB_WORKSPACE and extracts them back under it, so
          # an entry saved while vcpkg lived in the checkout restores into the
          # checkout again whatever `path` says. Every older key does that.
          key: vcpkg-windows-v5-2026.04.27-x64-windows-glib-sqlite3-libsodium-libsoup

      - name: Restore vcpkg installed tree
        id: vcpkg-installed-cache
        continue-on-error: true
        # actions/cache v5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          # v3, with no fallbacks: same workspace-rooted archive contract as
          # the binary packages above.
          key: vcpkg-windows-installed-v3-2026.04.27-x64-windows-glib-sqlite3-libsodium-libsoup

      - name: Clear failed vcpkg installed restore
        if: steps.vcpkg-installed-cache.outcome == 'failure'
        shell: bash
        run: rm -rf "$VCPKG_ROOT/installed"

      - name: Create vcpkg binary cache
        shell: cmd
        run: if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"

      - name: Install meson and ninja
        shell: cmd
        run: pip install meson ninja

      - name: Install C dependencies (vcpkg)
        shell: cmd
        run: |
          @echo off
          "%VCPKG_ROOT%\vcpkg.exe" install pkgconf:x64-windows glib:x64-windows sqlite3:x64-windows libsodium:x64-windows libsoup:x64-windows --x-abi-tools-use-exact-versions

      # Installing outside the checkout is only worth anything if nothing under
      # it can still be mistaken for project source, and a cache entry rooted at
      # an older layout would restore one back without failing anything. Assert
      # the property the layout exists for rather than trusting it holds.
      - name: Assert no dependency tree in the checkout
        shell: bash
        run: |
          status=0
          for tree in vcpkg vcpkg_installed vcpkg-binary-cache; do
            if [ -e "${GITHUB_WORKSPACE}/${tree}" ]; then
              echo "::error::${tree} resolved under the workspace"
              status=1
            fi
          done
          exit "$status"

      - name: Save vcpkg binary packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        # actions/cache v5
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save vcpkg installed tree
        if: steps.vcpkg-installed-cache.outcome == 'success' && steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        # actions/cache v5
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: ${{ steps.vcpkg-installed-cache.outputs.cache-primary-key }}

      - name: Restore meson packagecache
        id: meson-packagecache
        # actions/cache v5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: subprojects/packagecache
          key: windows-packagecache-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: |
            windows-packagecache-

      - name: Configure (clang-cl)
        shell: cmd
        run: |
          @echo off
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PKG_CONFIG=%VCPKG_INSTALLED_DIR%\tools\pkgconf\pkgconf.exe
          set PKG_CONFIG_PATH=%VCPKG_INSTALLED_DIR%\lib\pkgconfig;%VCPKG_INSTALLED_DIR%\share\pkgconfig
          set PATH=%VCPKG_INSTALLED_DIR%\tools\pkgconf;%VCPKG_INSTALLED_DIR%\bin;%PATH%
          set "SCCACHE_LAUNCHER=%SCCACHE_EXE%"
          if exist builddir rmdir /s /q builddir
          if "%WYRELOG_USE_SCCACHE%"=="1" (
            if not exist "%SCCACHE_LAUNCHER%" set /a SCCACHE_PROBE_FAILED=1
            if not defined SCCACHE_PROBE_FAILED "%SCCACHE_LAUNCHER%" clang-cl --version >NUL 2>&1
            if errorlevel 1 set /a SCCACHE_PROBE_FAILED=1
            if defined SCCACHE_PROBE_FAILED (
              set WYRELOG_USE_SCCACHE=0
              echo WYRELOG_USE_SCCACHE=0>>"%GITHUB_ENV%"
            )
          )
          if "%WYRELOG_USE_SCCACHE%"=="1" (
            set "CC=%SCCACHE_LAUNCHER% clang-cl"
            set "CXX=%SCCACHE_LAUNCHER% clang-cl"
            echo Windows compiler mode: sccache clang-cl
          ) else (
            set "CC=clang-cl"
            set "CXX=clang-cl"
            echo Windows compiler mode: native clang-cl
          )
          rem enable_windows_artifact_test_hooks is a test-only build: it is
          rem what makes fact-artifact-namespace-windows buildable at all, and
          rem it is never set for a shipped library (#741).
          meson setup builddir -Denable_tpm=disabled -Denable_client=enabled -Ddefault_library=static -Denable_audit=enabled -Denable_fact_store=${{ matrix.fact_store }} -Denable_secure_duckdb_bridge=${{ matrix.secure_bridge }} -Dduckdb_source=${{ matrix.duckdb_source }} -Denable_windows_artifact_test_hooks=enabled
          if "%WYRELOG_USE_SCCACHE%"=="1" (
            ninja -C builddir -t commands | findstr /I /C:"sccache" >NUL
            if errorlevel 1 exit /b 1
          )

      - name: Verify Windows CI timeout boundary
        shell: bash
        run: python3 tests/test-windows-ci-timeout-boundary.py "$GITHUB_WORKSPACE"

      - name: Save meson packagecache
        if: steps.meson-packagecache.outputs.cache-hit != 'true'
        continue-on-error: true
        # actions/cache v5
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: subprojects/packagecache
          key: ${{ steps.meson-packagecache.outputs.cache-primary-key }}

      - name: Build and test (clang-cl)
        shell: powershell
        run: |
          $command = @'
          @echo off
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PKG_CONFIG=%VCPKG_INSTALLED_DIR%\tools\pkgconf\pkgconf.exe
          if "${{ matrix.duckdb_source }}"=="prebuilt" set PATH=%GITHUB_WORKSPACE%\subprojects\duckdb-prebuilt-windows-amd64;%PATH%
          if "${{ matrix.duckdb_source }}"=="subproject" set PATH=%GITHUB_WORKSPACE%\builddir\subprojects\duckdb-amalgamated-src;%PATH%
          set PATH=%VCPKG_INSTALLED_DIR%\tools\pkgconf;%VCPKG_INSTALLED_DIR%\bin;%PATH%
          rem GLib locates gspawn-win64-helper beside the loaded glib DLL
          rem (vcpkg bin), but vcpkg installs it under tools\glib. Stage it
          rem beside the DLL so g_subprocess-based tests can launch children.
          copy /Y "%VCPKG_INSTALLED_DIR%\tools\glib\gspawn-win64-helper*.exe" "%VCPKG_INSTALLED_DIR%\bin\" >NUL
          meson compile -C builddir wyctl wyrelogd
          if not exist builddir\wyrelog\wyctl.exe exit /b 1
          builddir\wyrelog\wyctl.exe --help >NUL
          builddir\wyrelog\wyrelogd.exe --help | findstr /C:"--listen-port"
          if "${{ matrix.secure_bridge }}"=="enabled" (
            meson compile -C builddir test-windows-appverifier-probe test-windows-appverifier-probe-dll test-secure-duckdb-temp-child-windows test-fact-artifact-transition-driver test-fact-artifact-transition-windows
            meson test -C builddir secure-duckdb-bridge secure-duckdb-recording-filesystem secure-duckdb-temp-child-windows fact-artifact-inventory-contract fact-artifact-inventory-consumer-contract fact-artifact-inventory-consumer-wiring fact-artifact-inventory-consumer-wiring-self fact-artifact-transition-driver fact-artifact-transition-driver-wiring fact-artifact-transition-driver-wiring-self fact-artifact-transition-windows fact-artifact-namespace-windows fact-artifact-namespace-windows-inventory fact-artifact-namespace-windows-sidecar-replacement-isolated fact-artifact-namespace-windows-temp-binding-replacement-isolated fact-artifact-namespace-windows-lock-entry-replacement-isolated fact-artifact-namespace-windows-temp-token-real-crash-recovery fact-artifact-namespace-windows-cross-process fact-artifact-namespace-windows-temp-root-spill-child-capabilities fact-artifact-namespace-windows-temp-root-wrapper-ownership fact-provisioning-construct duckdb-after-walstart-no-wal duckdb-after-walstart-rendezvous duckdb-valid-commit-failure duckdb-valid-rollback-failure duckdb-fixed-wal-successful-checkpoint duckdb-fixed-wal-pre-move-abort-reopen duckdb-fixed-wal-interrupted-recovery fact-artifact-main-transition --print-errorlogs
            meson test -C builddir secure-duckdb-recording-filesystem --no-rebuild --print-errorlogs --test-args="-p /secure-duckdb-bridge/recording-filesystem/live-wal-read-only-recovery"
          ) else (
            meson test -C builddir --print-errorlogs --suite wyrelog
          )
          '@
          & "$env:GITHUB_WORKSPACE\tools\run-windows-with-symbolic-link-privilege.ps1" -Command $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build fact forget transaction cleanup seam (clang-cl)
        if: matrix.secure_bridge == 'enabled'
        shell: powershell
        run: |
          $command = @'
          @echo off
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PKG_CONFIG=%VCPKG_INSTALLED_DIR%\tools\pkgconf\pkgconf.exe
          set PATH=%GITHUB_WORKSPACE%\builddir\subprojects\duckdb-amalgamated-src;%VCPKG_INSTALLED_DIR%\tools\pkgconf;%VCPKG_INSTALLED_DIR%\bin;%PATH%
          meson compile -C builddir test-fact-store-forget-transaction
          '@
          & "$env:GITHUB_WORKSPACE\tools\run-windows-with-symbolic-link-privilege.ps1" -Command $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows Application Verifier handle gate
        if: matrix.secure_bridge == 'enabled'
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\run-windows-appverifier.ps1" -BuildDirectory builddir -OutputDirectory builddir\appverifier-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Application Verifier evidence
        if: ${{ runner.environment == 'github-hosted' && (always() && matrix.secure_bridge == 'enabled') }}
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: appverifier-windows-secure-bridge
          path: builddir/appverifier-artifacts/
          if-no-files-found: error

      - name: Show sccache statistics
        if: ${{ runner.environment == 'github-hosted' && (!cancelled()) }}
        shell: bash
        run: |
          sccache_path="$(cygpath -u "${SCCACHE_EXE:-}" 2>/dev/null || true)"
          if [ -n "$sccache_path" ] && [ -x "$sccache_path" ]; then
            stats="$("$sccache_path" --show-stats 2>&1)" || {
              echo "$stats"
              test "$WYRELOG_USE_SCCACHE" != 1
            }
            echo "$stats"
            if [ "$WYRELOG_USE_SCCACHE" = 1 ]; then
              echo "$stats" | grep -Eq 'Compile requests[[:space:]]+[1-9][0-9]*'
            fi
          else
            test "$WYRELOG_USE_SCCACHE" != 1
            echo 'sccache unavailable; no statistics to show'
          fi

      - name: Upload meson logs on failure
        if: ${{ runner.environment == 'github-hosted' && (always()) }}
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: meson-logs-windows${{ matrix.job_suffix }}
          path: builddir/meson-logs/
          if-no-files-found: ignore
