# Pinned formatter: Uncrustify 0.83.0_f (tools/install-uncrustify.sh).
# indent_continue = 4 is a measured churn minimum for this tree; 0, 2, 6 and 8
# each rewrite 60-100% more lines.
# wyrelog C formatting, matching the former gst-indent contract.
indent_columns        = 2
indent_with_tabs      = 0
input_tab_size        = 8
output_tab_size       = 8
indent_continue       = 4
indent_switch_case    = 2
indent_case_brace     = 0
code_width            = 0
nl_max_blank_in_func  = 2

# Preserve correctly aligned continuation stars in long block comments (#872).
#
# Uncrustify's cmt_multi_check_last heuristic removes the leading space from a
# block comment's continuation lines when the FIRST and LAST lines of the
# comment are the same length, measured from the first non-space character.
# The effect is to pull correctly aligned continuation stars one column left,
# and it is idempotent -- so the misaligned form becomes the only fixed point,
# and under the ledger rule in CLAUDE.md the only committable one.  Editing a
# comment into the right shape and running ./tools/format-c silently undoes it.
#
# The trigger is length equality, NOT line width and NOT comment size: it
# reproduces at six characters with a single continuation line.  Padding the
# opener, shortening the text, moving the closing star-slash to its own line,
# or changing any character count all "fix" it by breaking the equality.
#
# cmt_multi_check_last = false is the option that names this behaviour exactly
# and would be the narrower fix, but it is rejected on churn: it re-adds the
# space to comments already committed in the pulled-left shape, so 25 of the
# 168 files in tools/formatted-files.txt would stop being fixed points.
# cmt_indent_multi = false is broader -- it disables multi-line comment
# interior processing generally, including cmt_width, keyword substitution and
# leading-character handling -- and costs no reformatting: all 168 ledger files
# remain exact fixed points.  That breadth is currently free (cmt_width is 0,
# cmt_star_cont is false, the cmt_insert_* options are empty) but it does
# pre-empt setting any of them later.
#
# tools/check-comment-alignment.sh asserts the property against
# tools/format-fixtures/block-comment-alignment.c.
cmt_indent_multi      = false

# Keep control-statement braces attached and cuddle else.
nl_if_brace           = remove
nl_for_brace          = remove
nl_while_brace        = remove
nl_switch_brace       = remove
nl_brace_else         = remove
nl_else_if            = remove

# Put aggregate declaration braces on the following line.
nl_struct_brace       = add
nl_union_brace        = add
nl_enum_brace         = add

# Preserve existing preprocessor indentation and spacing. The multi-line
# define body indent defaults to 8, which re-indents this tree's X-macro
# tables away from their 2-column style; match the tree instead.
pp_multiline_define_body_indent = 2
pp_indent             = ignore
pp_space_after        = ignore

