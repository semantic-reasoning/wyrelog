# SPDX-License-Identifier: GPL-3.0-or-later
#
# Canonical LoBAC template manifest.
# The SHA-256 digest covers the fixed engine load order:
# bootstrap.dl, fsm/principal.dl, fsm/session.dl,
# fsm/permission_scope.dl, lobac/decision.dl, with a single '\n'
# separator inserted between files to match wyl_engine_load_templates().
# CR bytes are ignored for the digest so Windows CRLF checkouts verify
# against the same canonical artifact identity as LF checkouts.

[template]
version=0
migration_semantics=append-only
migration_path=migrations
sha256=7f62144ec0261bceddef83b30f44bafd83d295d32b4233e76e2a2d6f71586862

# SIGNATURE PENDING.  The digest above covers the service decision authority
# rules (#725) plus three changes to service_armed from #834: the !frozen(S)
# gate, the session_state/session_active scope-liveness gate, and the armed/3
# exclusion comment.  The scope-liveness gate is the largest semantic change
# to the authorization rule in this branch: a service decide now requires the
# credential tenant to be an unsealed tenant, so a sealed tenant denies at the
# rule and not only at the upstream tenant-active gate.
# The signature below is the released one from main: it covers digest
# 80ca6378aa35404ef4ba6e31afb8b7fd9dc4ca709a81105d4b3dd38eb574ebff, which
# the release custodian signed in "release: sign service authority template
# digest".  This branch supersedes that artifact, so the signature no longer
# matches the digest above and does not verify.  wyl_engine_load_templates
# therefore fails WYRELOG_E_CRYPTO, and every handle open with it.
#
# This is a supersession of a RELEASED identity, not of a pending one.
# 80ca6378 is signed and merged to main; the scope-liveness gate changes the
# rule it certifies, so it must be re-signed rather than amended.  See
# docs/operator-runbook.md, "Template Artifact Release And Replay Policy".
#
# One intermediate digest never reached main:
# 32d5cd721401c6e6414cfb8b438c4205ce434212b2258bd6d681ac010f17d3bd was
# committed on this branch and had passing runs, but was never signed; the
# scope-liveness gate superseded it before it could be.  Superseding it here
# keeps this branch at exactly one pending identity.
#
# This cannot be resolved in-tree: the private Ed25519 keys are held offline by
# the release custodian role (see docs/operator-runbook.md, "Template Artifact
# Release And Replay Policy").  Re-sign the digest above with context
# wyrelog-template-v0-sha256 and replace the ed25519 value.  The signature is
# the LAST commit before merge; any subsequent .dl byte invalidates it.  The
# public_key line changes only on a key rotation, which is a release event, not
# a fix for this.
#
# The digest is reproducible with no key and no daemon: SHA-256 over
# bootstrap.dl, fsm/principal.dl, fsm/session.dl, fsm/permission_scope.dl and
# lobac/decision.dl concatenated in that order with one newline byte
# between files, and every carriage-return byte dropped first.
[signature]
algorithm=ed25519
context=wyrelog-template-v0-sha256
public_key=820686b7831df40a09c0f35b5f1c8ec24ede2162cf2cc200b55312eaf93bca5e
ed25519=c30301ed2303bfc466630fa795c74076d8596ed102b12c0ff9551c55ab86ad1585c1e42f4a3d27c87c107c1c602f7def956ebaf3c223ca6998eb45b43174c007
