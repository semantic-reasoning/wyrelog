#
# Canonical LoBAC template manifest.
# The SHA-256 digest covers the fixed engine load order:
# bootstrap.dl, fsm/principal.dl, fsm/session.dl,
# fsm/permission_scope.dl, lobac/decision.dl, with a single '\n'
# separator inserted between files to match wyl_engine_load_templates().
# CR bytes are ignored for the digest so Windows CRLF checkouts verify
# against the same canonical artifact identity as LF checkouts.

[template]
version=0
migration_semantics=append-only
migration_path=migrations
sha256=80ca6378aa35404ef4ba6e31afb8b7fd9dc4ca709a81105d4b3dd38eb574ebff

# SIGNATURE PENDING.  The digest above covers the service decision authority
# rules added to decision.dl and lobac/decision.dl; the signature below still
# covers the superseded digest
# e4c15199c77002a4dc20e9d80f5cb51c2d4bac21969703d2770fddbfdd3595b4 and does
# not verify.  wyl_engine_load_templates therefore fails WYRELOG_E_CRYPTO, and
# every handle open with it.  This cannot be resolved in-tree: the private
# Ed25519 keys are held offline by the release custodian role (see
# docs/operator-runbook.md, "Template Artifact Release And Replay Policy").
# Re-sign the digest above with context wyrelog-template-v0-sha256 and replace
# the ed25519 value.  The public_key line changes only on a key rotation, which
# is a release event, not a fix for this.
[signature]
algorithm=ed25519
context=wyrelog-template-v0-sha256
public_key=820686b7831df40a09c0f35b5f1c8ec24ede2162cf2cc200b55312eaf93bca5e
ed25519=2d26c6d7f7bb5813855fe9dd8b73475f15ecf89e78c751fe55b07e9a58da4fed39d0fb3defa9ee56931bee208c98a3dc3513b4ee30f645ea12a365e337ab240e
