#
# Canonical LoBAC template manifest.
# The SHA-256 digest covers the fixed engine load order:
# bootstrap.dl, fsm/principal.dl, fsm/session.dl,
# fsm/permission_scope.dl, lobac/decision.dl, with a single '\n'
# separator inserted between files to match wyl_engine_load_templates().
# CR bytes are ignored for the digest so Windows CRLF checkouts verify
# against the same canonical artifact identity as LF checkouts.

[template]
version=0
migration_semantics=append-only
migration_path=migrations
sha256=32d5cd721401c6e6414cfb8b438c4205ce434212b2258bd6d681ac010f17d3bd

# SIGNATURE PENDING.  The digest above covers the service decision authority
# rules (#725) plus the freeze gate and the armed/3 exclusion comment added to
# service_armed (#834).  The signature below covers the superseded digest
# e4c15199c77002a4dc20e9d80f5cb51c2d4bac21969703d2770fddbfdd3595b4 and does not
# verify.  wyl_engine_load_templates therefore fails WYRELOG_E_CRYPTO, and every
# handle open with it.
#
# The intermediate digest 80ca6378aa35404ef4ba6e31afb8b7fd9dc4ca709a81105d4b3dd38eb574ebff
# was never signed and never had a passing test run; it is superseded here so
# this branch carries exactly one pending identity rather than minting a
# release identity no deployment should see.
#
# This cannot be resolved in-tree: the private Ed25519 keys are held offline by
# the release custodian role (see docs/operator-runbook.md, "Template Artifact
# Release And Replay Policy").  Re-sign the digest above with context
# wyrelog-template-v0-sha256 and replace the ed25519 value.  The signature is
# the LAST commit before merge; any subsequent .dl byte invalidates it.  The
# public_key line changes only on a key rotation, which is a release event, not
# a fix for this.
#
# The digest is reproducible with no key and no daemon: SHA-256 over
# bootstrap.dl, fsm/principal.dl, fsm/session.dl, fsm/permission_scope.dl and
# lobac/decision.dl concatenated in that order with one newline byte
# between files, and every carriage-return byte dropped first.
[signature]
algorithm=ed25519
context=wyrelog-template-v0-sha256
public_key=820686b7831df40a09c0f35b5f1c8ec24ede2162cf2cc200b55312eaf93bca5e
ed25519=0d7b770af75b58018b93f2ccf6c52e40e2c9c6d0767c825c31d76d3b498c442d79279beddef906ae08d108534541b1e4b4eb0f5eb43c07e100834c11a1180508
